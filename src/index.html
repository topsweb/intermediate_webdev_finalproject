<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interest Rate Calculator</title>
    <meta
        name="description"
        content="Calculate simple interest and total amounts with this easy-to-use Interest Rate Calculator."
    >
    
    <link rel="icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href=<%=require('./style.css')%> type="text/css" media="all" />
</head>

<body>
    <div class="container">
        <h1>Interest Rate Calculator</h1>

        <div class="input-wrapper">
            <div class="wrapper">
                <label for="principal">Principal Amount</label>
                <input type="number" id="principal" value="1000">
            </div>
        </div>

        <div class="input-wrapper">
            <div class="wrapper">
                <label for="rate">Rate (%)</label>
                <input type="number" id="rate" value="5">
            </div>
        </div>

        <div class="input-wrapper">
            <div class="wrapper">
                <label for="time">Time (Years)</label>
                <input type="number" id="time" value="1">
            </div>
        </div>

        <button id="calculate-btn" onclick="calculate()">Calculate</button>

        <div id="result"></div>
    </div>


</body>

</html>
